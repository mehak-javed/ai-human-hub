name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_human_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_human_hub
      CLERK_SECRET_KEY: sk_test_ci_only_not_a_real_key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Check production security settings
        env:
          DJANGO_HTTPS_ONLY: "True"
          DJANGO_SECRET_KEY: ci-only-long-random-looking-value-0123456789abcdefghijklmnopqrstuvwxyz
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        run: pytest -v